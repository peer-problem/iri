[project]
name = "kids-sandbox"
version = "0.1.0"
description = "Voice API and Runpod training, serving and evaluation tools for an age-aware Korean LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../api/tests", "tests"]
pythonpath = [".."]

[tool.ruff]
cache-dir = "runpod/.ruff_cache"
target-version = "py312"
line-length = 100
# Archived experiment drivers are immutable evidence, not maintained runtime code.
extend-exclude = ["**/artifacts/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "runpod"]
