limit_req_zone $binary_remote_addr zone=iri_requests:1m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name api.iri.today;
    location /.well-known/acme-challenge/ { root /var/www/iri-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.iri.today;
    ssl_certificate /etc/letsencrypt/live/api.iri.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iri.today/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_req zone=iri_requests burst=30 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 110s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
